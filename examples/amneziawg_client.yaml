# AmneziaWG client outbound.
#
# Two SOCKS5 inbounds: one over an AmneziaWG 2.0 tunnel, one over 3.0.
#
# Every parameter that shapes the wire format (h1-h4, s1-s4, the junk
# parameters, the header protection key, the content padding) must match the
# server exactly. A mismatch is never reported — the peer cannot recognise the
# packets as WireGuard at all, so the handshake simply never completes.

# --- AmneziaWG 2.0 ---
- address: 127.0.0.1:1080
  protocol:
    type: socks
  rules:
    - masks: "0.0.0.0/0"
      action: allow
      client_chain:
        address: "awg.example.com:51820"
        protocol:
          type: amneziawg
          private_key: "AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA="  # replace with your key
          peer_public_key: "ISIjJCUmJygpKissLS4vMDEyMzQ1Njc4OTo7PD0+P0A="  # replace with your key
          local_addresses:
            - "10.8.0.2/32"
          allowed_ips:
            - "0.0.0.0/0"
            - "::/0"
          persistent_keepalive: 25
          mtu: 1280
          awg:
            # Junk packets sent before the handshake initiation.
            jc: 4
            jmin: 64
            jmax: 256
            # Random padding prefixed to each message type.
            s1: 32
            s2: 32
            s3: 16
            s4: 16
            # Message type values replacing WireGuard's 1, 2, 3 and 4.
            h1: "1000000-1000999"
            h2: "1001000-1001999"
            h3: "1002000-1002999"
            h4: "1003000-1003999"

# --- AmneziaWG 3.0 ---
- address: 127.0.0.1:1081
  protocol:
    type: socks
  rules:
    - masks: "0.0.0.0/0"
      action: allow
      client_chain:
        address: "awg3.example.com:51820"
        protocol:
          type: amneziawg
          private_key: "AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA="  # replace with your key
          peer_public_key: "ISIjJCUmJygpKissLS4vMDEyMzQ1Njc4OTo7PD0+P0A="  # replace with your key
          local_addresses: "10.8.0.2/32"
          allowed_ips: "0.0.0.0/0"
          mtu: 1280
          awg:
            jc: 4
            jmin: 64
            jmax: 256
            # Header protection reads its 12-byte nonce from the padding
            # prefix, so each of s1-s4 must be at least 12.
            s1: 32
            s2: 32
            s3: 16
            s4: 16
            h1: "1000000-1000999"
            h2: "1001000-1001999"
            h3: "1002000-1002999"
            h4: "1003000-1003999"

            # ChaCha20 over the message header. Base64 as an AmneziaWG .conf
            # writes it, or 64 hex characters as the UAPI socket does.
            header_protection_key: "ERERERERERERERERERERERERERERERERERERERERERE="  # replace with your key
            # Extra random padding inside the AEAD envelope, in bytes.
            content_padding_addition: "0-64"

            # Randomized timings, in seconds (max_handshake_attempts is a
            # count). These are local — the two ends need not agree.
            rekey_after_time: "110-130"
            rekey_timeout: "5"
            reject_after_time: "170-190"
            keepalive_timeout: "8-12"
            max_handshake_attempts: "18-20"
            persistent_keepalive_interval: "20-30"
