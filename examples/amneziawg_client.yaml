# AmneziaWG 3.0 client. Demonstration keys only: replace both keys and the peer endpoint.
# The amnezia values must match the server. The MTU defaults to 1408 minus s4.
- client_group: vpn
  client_chains:
    - address: "127.0.0.1:51820"
      protocol:
        type: wireguard
        private_key: "KioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKio="
        public_key: "F9firNML9eGdhhroCYjRf66PZi9dgLAFP2zHPNqx0mQ="
        addresses: ["10.78.0.2/32"]
        allowed_ips: ["0.0.0.0/0", "::/0"]
        persistent_keepalive: 25
        amnezia:
          jc: 3
          jmin: 40
          jmax: 70
          s1: 15
          s2: 18
          s3: 20
          s4: 23
          h1: "100000-100100"
          h2: "200000-200100"
          h3: "300000-300100"
          h4: "400000-400100"
          i1: "<b 0xc0ffee><r 16><t>"
          header_protection_key: "1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a"
          content_padding_addition: "0-32"
          rekey_after_time: "110-130"

- address: "0.0.0.0:1080"
  protocol: {type: socks}
  rules:
    - masks: ["0.0.0.0/0", "::/0"]
      action: allow
      client_chain: vpn
