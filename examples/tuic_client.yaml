# Route everything through a TUIC v5 server.
#
# TUIC owns its transport, so it must be the only hop in a chain, and its TLS
# options live in quic_settings rather than needing 'transport: quic'.
- address: "127.0.0.1:1080"
  protocol:
    type: socks
  rules:
    - masks: "0.0.0.0/0"
      action: allow
      client_chain:
        - address: "example.com:443"
          protocol:
            type: tuic
            uuid: "b0e80a62-8a51-47f0-91f1-f0f7faf8d9d4"
            password: "a strong password"
            # native carries UDP over QUIC datagrams; 'quic' carries them over
            # unidirectional streams, which survives a path that mangles
            # datagrams and does not fragment a large packet.
            udp_relay_mode: native
          quic_settings:
            sni_hostname: "example.com"
