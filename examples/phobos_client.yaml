# Phobos client in front of a plain WireGuard server that sits behind a Phobos proxy.
# Demonstration keys only: replace both keys, the peer endpoint and the Phobos key.
# The Phobos key must be a quoted string. There is no Phobos server in shoes.
- client_group: vpn
  client_chains:
    - address: "127.0.0.1:51820"
      protocol:
        type: wireguard
        private_key: "KioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKio="
        public_key: "F9firNML9eGdhhroCYjRf66PZi9dgLAFP2zHPNqx0mQ="
        addresses: ["10.79.0.2/32"]
        allowed_ips: ["0.0.0.0/0", "::/0"]
        persistent_keepalive: 25
        phobos:
          key: "demonstration-phobos-key"
          masking: stun

- address: "0.0.0.0:1080"
  protocol: {type: socks}
  rules:
    - masks: ["0.0.0.0/0", "::/0"]
      action: allow
      client_chain: vpn
