- clash_api_address: "0.0.0.0:9090"
  secret: "replace-with-a-strong-controller-secret"
  cors_origins:
    - "https://board.zash.run"

- cache_file_path: "./cache.db"

- client_group: outbound
  strategy: selector
  default: us-east
  client_proxies:
    - name: us-east
      address: "us.example.com:1080"
      protocol:
        type: socks
    - name: eu-west
      address: "eu.example.com:1080"
      protocol:
        type: socks

- name: local-socks
  address: "0.0.0.0:1080"
  protocol:
    type: socks
    username: example
    password: "replace-with-a-proxy-password"
  rules:
    - mask: "0.0.0.0/0"
      action: allow
      client_chain: outbound
