# Route everything through a mieru server, over mieru's TCP transport.
#
# mieru derives its encryption key from the current time rounded to two
# minutes, so the client and server clocks must agree to within about four
# minutes. A device whose clock has not synchronised cannot authenticate at
# all, and the error says so rather than reporting a generic failure.
#
# The username is part of the key derivation, not just a label, so it must
# match the server exactly.
- address: "127.0.0.1:1080"
  protocol:
    type: socks
  rules:
    - masks: "0.0.0.0/0"
      action: allow
      client_chain:
        - address: "example.com:8964"
          protocol:
            type: mieru
            username: "alice"
            password: "a strong password"
