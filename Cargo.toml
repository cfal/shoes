[package]
name = "shoes"
version = "0.2.8"
edition = "2024"
autotests = false
license = "MIT"
description = "A multi-protocol proxy server."
homepage = "https://github.com/cfal/shoes/"
repository = "https://github.com/cfal/shoes/"
readme = "README.md"
keywords = ["proxy", "proxy-server", "shadowsocks", "v2ray", "vmess"]
categories = ["command-line-utilities", "network-programming"]

[workspace]
members = ["tests/support"]
resolver = "3"

[lib]
name = "shoes"
# rlib = Rust library (for Rust dependencies)
# cdylib = C dynamic library (.so on Linux/Android, .dylib on macOS)
# staticlib = C static library (.a) - required for iOS
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "shoes"
path = "src/main.rs"

[features]
default = []
ffi = []  # Enable FFI module for non-Android builds
integration-tests = []
optional-peer-tests = ["integration-tests"]
external-network-tests = ["integration-tests"]
privileged-tests = ["integration-tests"]
stress-tests = ["integration-tests"]

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["integration-tests"]

[[test]]
name = "external_network"
path = "tests/external_network.rs"
required-features = ["external-network-tests"]

[[test]]
name = "optional_peer"
path = "tests/optional_peer.rs"
required-features = ["optional-peer-tests"]

[[test]]
name = "privileged"
path = "tests/privileged.rs"
required-features = ["privileged-tests"]

[[test]]
name = "stress"
path = "tests/stress.rs"
required-features = ["stress-tests"]

[dependencies]
async-trait = "0.1.89"
aws-lc-rs = { version = "1.18.1", default-features = false }
base64 = "0.22.1"
blake3 = "1.8.5"
bytes = "1.12.1"
chrono = "0.4.45"
dashmap = "6.2.1"
digest = "0.11.3"
etherparse = "0.20.3"
futures = "0.3.32"
h2 = "0.4.15"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hickory-resolver = { version = "0.26.1", default-features = false, features = ["tokio", "tls-aws-lc-rs", "https-aws-lc-rs", "h3-aws-lc-rs"] }
http = "1.4.2"
http-body-util = "0.1.3"
hyper = { version = "1.10.1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server"] }
indexmap = "2.14.0"
libc = "0.2.186"
log = { version = "0.4.33", features = ["std", "release_max_level_info"] }
lru = "0.18.1"
md-5 = "0.11.0"
memchr = "2.8.3"
mime_guess = "2.0.5"
notify = "8.2.0"
parking_lot = "0.12.5"
percent-encoding = "2.3.2"
quinn = { version = "0.11.11", default-features = false, features = ["log", "platform-verifier", "runtime-tokio", "rustls-aws-lc-rs"] }
rand = "0.10.2"
rand_core = "0.10.1"
rcgen = { version = "0.14.8", default-features = false, features = ["aws_lc_rs", "pem"] }
rust-argon2 = "3.0.0"
rustc-hash = "2.1.3"
rustls = "0.23.45"
serde = { version = "1.0.228", features = ["derive", "std"] }
serde_yaml = "0.9.34"
shake = "0.1.0"
smoltcp = { version = "0.13.1", default-features = false, features = ["std", "log", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-icmp", "socket-udp", "socket-tcp", "socket-tcp-cubic", "phy-tuntap_interface", "assembler-max-segment-count-32"] }
socket2 = "0.6.4"
subtle = "2.6.1"
tokio = { version = "1.52.3", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = { version = "0.7.18", features = ["time", "io"] }
tun = { version = "0.8.13", features = ["async"] }
url = "2.5.8"
webpki-roots = { version = "1.0.8" }
x509-parser = { version = "0.18.1", default-features = false, features = ["verify-aws"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["test-util"] }
rcgen = { version = "0.14.8", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls-pemfile = "2.2.0"
serde_json = "1.0.150"
shoes-test-support = { path = "tests/support" }
tempfile = "3.27.0"
tokio-rustls = "0.26.4"

# jemalloc for better memory performance (not supported on Windows MSVC, iOS, or Android)
[target.'cfg(not(any(target_env = "msvc", target_os = "ios", target_os = "android")))'.dependencies]
tikv-jemallocator = "0.7.0"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
jni = "0.22"
ndk-sys = "0.6.0"

[profile.release]
opt-level = 3
lto = "fat"
strip = true
