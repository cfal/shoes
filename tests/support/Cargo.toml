[package]
name = "shoes-test-support"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
aws-lc-rs = { version = "1.18.1", default-features = false }
base64 = "0.23.1"
bytes = "1.12.1"
futures = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server"] }
rand = "0.10.3"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = "0.23.45"
rustls-pemfile = "2.2.0"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-rustls = "0.26.6"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.190"
