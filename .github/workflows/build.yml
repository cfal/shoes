name: Build Binaries

on:
  push:
    branches: [ master, mobile ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, mobile ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds (using cross for cross-compilation).
          # asset_name is the friendly name used for the release download; the
          # target triple (with its "unknown" vendor) is still what we build.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            binary_name: shoes
            asset_name: linux-x86_64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            binary_name: shoes
            asset_name: linux-x86_64-musl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            binary_name: shoes
            asset_name: linux-arm64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            binary_name: shoes
            asset_name: linux-arm64-musl

          # macOS build (native compilation). Intel macOS was dropped
          # deliberately: nothing deploys there.
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            binary_name: shoes
            asset_name: macos-arm64

          # Windows builds
          # TODO: enable when working
          # - target: x86_64-pc-windows-msvc
          #   os: windows-latest
          #   use_cross: false
          #   binary_name: shoes.exe
          #   asset_name: windows-x86_64
          # - target: aarch64-pc-windows-msvc
          #   os: windows-latest
          #   use_cross: false
          #   binary_name: shoes.exe
          #   asset_name: windows-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies
        if: matrix.use_cross == true
        run: |
          sudo apt-get update
          case "${{ matrix.target }}" in
            "aarch64-unknown-linux-gnu")
              sudo apt-get install -y gcc-aarch64-linux-gnu
              ;;
            "aarch64-unknown-linux-musl")
              sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
              ;;
            "x86_64-unknown-linux-musl")
              sudo apt-get install -y musl-tools
              ;;
          esac

      # Was `cargo install cross`, which compiled cross from source once per
      # matrix leg that needed it. install-action fetches a release binary.
      - name: Install cross-compilation tool
        if: matrix.use_cross == true
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2
        with:
          tool: cross

      - name: Setup cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build binary (using cross)
        if: matrix.use_cross == true
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build binary (native)
        if: matrix.use_cross == false
        run: cargo build --release --locked --target ${{ matrix.target }}

      # This step used to end in `|| echo "Binary test failed, but file
      # exists"`, so the binary could fail to run and the job still went green.
      # A check that cannot fail is not a check.
      - name: Verify binary
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          ls -la "$bin"
          file "$bin"

      # There is no --help; the binary rejects it and prints usage with a
      # non-zero status. -V is the flag that exists. The dry runs are the part
      # with real value: each parses a config end to end without binding a
      # port, and they cover the config paths the mobile work added. Only
      # cert-free examples can be used -- the rest reference PEM files that
      # are not in the repository.
      - name: Smoke test binary
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          bin="./target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          "$bin" --version
          for cfg in socks_basic multi_hop_chain tun_vpn tun_fake_ip amneziawg_client sniff \
                     hysteria2_client tuic_client; do
            echo "==> dry run: examples/$cfg.yaml"
            "$bin" --dry-run "examples/$cfg.yaml"
          done

          # rule_set.yaml names two .srs files that are not kept in examples/.
          # The test fixtures are the same lists under the same names, so
          # copying them in covers the rule-set path -- which reads and parses
          # a binary format at startup, and is worth exercising on the release
          # binary rather than only in unit tests.
          cp tests/data/rule_sets/geosite-google.srs tests/data/rule_sets/geoip-ru.srs examples/
          echo "==> dry run: examples/rule_set.yaml"
          "$bin" --dry-run examples/rule_set.yaml
          rm -f examples/geosite-google.srs examples/geoip-ru.srs

      # No `strip` here: the release profile already sets strip = true
      # (Cargo.toml), so running it again was a no-op that could only fail.
      - name: Package binary
        run: |
          set -euo pipefail
          mkdir -p artifacts
          tarball="${{ github.event.repository.name }}-${{ matrix.asset_name }}.tar.gz"
          tar -czf "artifacts/$tarball" \
            -C "target/${{ matrix.target }}/release" "${{ matrix.binary_name }}"
          ls -la "artifacts/$tarball"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.asset_name }}
          path: artifacts/*.tar.gz
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          find artifacts -type f -name '*.tar.gz' -exec cp {} release-artifacts/ \;
          ls -la release-artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-artifacts/*
          # Published, not a draft: a tag push should produce a visible release
          # with the artifacts attached, not one that waits for a manual click.
          draft: false
          generate_release_notes: true
