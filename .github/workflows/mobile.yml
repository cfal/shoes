name: Build Mobile Libraries

on:
  push:
    branches: [ master, mobile ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, mobile ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # iOS — XCFramework (device arm64 + simulator arm64)
  # ──────────────────────────────────────────────────────────────────────────
  ios:
    name: Build iOS XCFramework
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ios

      # cbindgen has no taiki-e/install-action manifest, so it is cached as a
      # binary the same way cargo-ndk is below. Building it from source on
      # every run cost minutes on the most expensive runner in the pipeline.
      - name: Cache cbindgen binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cbindgen
          key: cbindgen-${{ runner.os }}-v1

      - name: Install cbindgen
        run: command -v cbindgen || cargo install cbindgen --locked

      - name: Build XCFramework
        run: bash scripts/build-ios.sh

      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: Shoes.xcframework
          path: output/ios/Shoes.xcframework
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────
  # Android — AAR with JNI .so for arm64-v8a, armeabi-v7a
  # ──────────────────────────────────────────────────────────────────────────
  android:
    name: Build Android AAR
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2
        with:
          tool: cargo-ndk

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.5.0'

      # Both, and to the same NDK: the runner presets ANDROID_NDK_ROOT to an
      # older install than ANDROID_NDK_LATEST_HOME, and cargo-ndk warns when
      # the two disagree.
      - name: Set NDK path
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      # This job used to inline `cargo ndk ... && gradle assembleRelease`
      # instead of calling the script, and so skipped the step at
      # scripts/build-android.sh:66 that deletes the cdylibs cargo-ndk copies
      # in alongside libshoes.so. The released AAR therefore still carried
      # libboringtun-*.so on every ABI while a local build did not. Calling the
      # script keeps one definition of how the AAR is built.
      - name: Build AAR
        run: bash scripts/build-android.sh

      # And verify it, so the divergence cannot come back silently.
      - name: Verify AAR ships only libshoes.so
        run: |
          set -euo pipefail
          aar=output/android/shoes-release.aar
          libs=$(unzip -Z1 "$aar" | grep '^jni/.*\.so$' || true)
          if [ -z "$libs" ]; then
            echo "No native libraries in $aar"
            exit 1
          fi
          echo "$libs"
          unexpected=$(echo "$libs" | grep -v '/libshoes\.so$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected native libraries in the AAR:"
            echo "$unexpected"
            exit 1
          fi
          for abi in arm64-v8a armeabi-v7a; do
            echo "$libs" | grep -q "^jni/$abi/libshoes\.so$" \
              || { echo "Missing libshoes.so for $abi"; exit 1; }
          done

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: shoes-android
          path: output/android/shoes-release.aar
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────
  # Release — attach artifacts to GitHub releases on tag pushes
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Attach to Release
    needs: [ ios, android ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip XCFramework
        run: |
          set -euo pipefail
          cd artifacts
          zip -r Shoes.xcframework.zip Shoes.xcframework/

      - name: Attach to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/Shoes.xcframework.zip
            artifacts/shoes-android/shoes-release.aar
          draft: true
          generate_release_notes: false
