name: REALITY interoperability

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  xray:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Xray v26.10.21
    env:
      CARGO_BUILD_JOBS: 1
      GOMAXPROCS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/checkout@v7
        with:
          repository: XTLS/Xray-core
          ref: 1b1647cd9ddf0abc34b981d4611fc03bcac1ca74
          path: reality-peer
      - name: Cache Rust artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-reality-${{ hashFiles('**/Cargo.lock') }}
      - name: Build pinned Xray
        working-directory: reality-peer
        run: go build -p 1 -o "$RUNNER_TEMP/xray" ./main
      - name: Run local REALITY peer matrix
        env:
          XRAY_BINARY: ${{ runner.temp }}/xray
        run: cargo test --locked --features optional-peer-tests --test reality_interop -- --test-threads=1
