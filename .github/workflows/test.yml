name: Test

on:
  push:
    branches: [ master, mobile ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, mobile ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # Replaces three hand-rolled actions/cache steps that keyed only on the
      # Cargo.lock hash with no restore-keys, so any dependency change meant a
      # completely cold rebuild. rust-cache handles the registry, the git
      # checkouts and target/ together, and keys on the compiler version too.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: test

      # No separate `cargo build` step: `cargo test` builds what it needs, and
      # doing both compiled the tree twice. No --verbose either -- it buried
      # the failure that mattered under everything that did not.
      - name: Run tests
        run: cargo test --locked

      # The `ffi` feature gates src/tun/platform.rs and the protect_socket call
      # in src/amneziawg/tunnel.rs:79. Without this the socket-protection code
      # is never compiled by CI on any runner, because the alternative gates
      # are target_os = "android" / "ios".
      - name: Run tests with the FFI surface enabled
        run: cargo test --locked --features ffi

  # The first Windows CI this repository has had. build.yml carries two
  # commented-out Windows targets marked "TODO: enable when working", and
  # nobody can tell whether that is still true without a Windows runner --
  # cross-checking from macOS or Linux fails in aws-lc-sys and blake3 for
  # want of an MSVC toolchain, which says nothing about the real thing.
  #
  # The immediate reason to have it: src/lib.rs gates the TUN module on
  # cfg(unix), so shoes::control takes a cfg(not(unix)) branch on Windows
  # that no other job compiles. The desktop GUI targets Windows before the
  # tunnel does, so that branch has to build.
  windows-check:
    name: Check Windows build
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: windows-check

      # aws-lc-sys assembles its own crypto on windows-msvc and wants NASM for
      # it. Installed through choco rather than a third-party action so this
      # job adds no new pinned dependency.
      - name: Install NASM
        run: choco install nasm --no-progress -y

      - name: Add NASM to PATH
        run: echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      # cargo check, not test: TUN is unsupported on Windows until a wintun
      # backend lands, so there is nothing yet to run. What matters now is that
      # the library and its cfg(not(unix)) arms compile at all.
      - name: Check the library
        run: cargo check --locked --lib
