name: Test

on:
  push:
    branches: [ master, mobile ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, mobile ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # Replaces three hand-rolled actions/cache steps that keyed only on the
      # Cargo.lock hash with no restore-keys, so any dependency change meant a
      # completely cold rebuild. rust-cache handles the registry, the git
      # checkouts and target/ together, and keys on the compiler version too.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: test

      # No separate `cargo build` step: `cargo test` builds what it needs, and
      # doing both compiled the tree twice. No --verbose either -- it buried
      # the failure that mattered under everything that did not.
      - name: Run tests
        run: cargo test --locked

      # The `ffi` feature gates src/tun/platform.rs and the protect_socket call
      # in src/amneziawg/tunnel.rs:79. Without this the socket-protection code
      # is never compiled by CI on any runner, because the alternative gates
      # are target_os = "android" / "ios".
      - name: Run tests with the FFI surface enabled
        run: cargo test --locked --features ffi

      # The desktop host builds with these; nothing else should. Running both
      # ends of the matrix is what keeps `default = []` honest -- these two
      # features hold runtime state, and mobile must not inherit it.
      - name: Run tests with the desktop control surface enabled
        run: cargo test --locked --features desktop

  # Windows went from cargo check to the full test suite when the wintun TUN
  # backend landed: the shared smoltcp loop is exercised through a scripted
  # device double, so the stack logic runs here with no driver and no
  # elevation. The wintun-specific half (adapter creation, the event wait) is
  # behind an #[ignore]d test that needs Administrator and wintun.dll, run by
  # hand -- see docs/specs/2026-08-27-windows-tun-backend.md.
  windows-test:
    name: Test Windows build
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: windows-check

      # aws-lc-sys assembles its own crypto on windows-msvc and wants NASM for
      # it. Installed through choco rather than a third-party action so this
      # job adds no new pinned dependency.
      - name: Install NASM
        run: choco install nasm --no-progress -y

      - name: Add NASM to PATH
        run: echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      # --bins as well as --lib: src/main.rs declares its module tree
      # independently (the trap AGENTS.md documents), so a Windows-only
      # compile error confined to the binary is invisible to a lib-only run.
      - name: Run tests
        run: cargo test --locked --lib --bins

      # Both ends of the feature matrix, as on Linux: control::stats and the
      # scripted-loop counter test only compile with the features on.
      - name: Run tests with the desktop control surface enabled
        run: cargo test --locked --lib --bins --features desktop
